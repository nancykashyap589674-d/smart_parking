<!DOCTYPE html>
<html>
<head>
<title>Smart Parking</title>

<style>
body{
background:black;
color:white;
text-align:center;
font-family:Arial;
}

input{
padding:10px;
margin:5px;
border-radius:5px;
border:none;
width:220px;
}

.slot{
width:120px;
padding:15px;
margin:10px;
color:white;
border:none;
font-size:18px;
cursor:pointer;
}

.free{
background:green;
}

.occupied{
background:red;
cursor:not-allowed;
}

.card{
border:1px solid white;
padding:10px;
margin:10px;
border-radius:10px;
}
</style>

<script>

// =======================
// BOOK SLOT FUNCTION
// =======================
function bookSlot(slot){

let name = document.getElementById("username").value
let phone = document.getElementById("phone").value
let carname = document.getElementById("carname").value
let carnumber = document.getElementById("carnumber").value
let time = document.getElementById("time").value

if(name=="" || phone=="" || carname=="" || carnumber=="" || time==""){
alert("Please fill all details first")
return
}

fetch("/book_slot", {
  method: "POST",
  headers: {
    "Content-Type": "application/x-www-form-urlencoded"
  },
  body: 
    "slot=" + encodeURIComponent(slot) +
    "&email={{email}}" +
    "&name=" + encodeURIComponent(name) +
    "&phone=" + encodeURIComponent(phone) +
    "&carname=" + encodeURIComponent(carname) +
    "&carnumber=" + encodeURIComponent(carnumber) +
    "&time=" + encodeURIComponent(time)
})

.then(response => response.json())
.then(data => {

if(data.status === "success"){
  alert("Slot Booked Successfully")
  location.reload()
}else{
  alert(data.message)
}

})
}

// =======================
// EXIT SLOT FUNCTION
// =======================
function exitSlot(slot){

fetch("/exit_slot", {
  method: "POST",
  headers: {
    "Content-Type": "application/x-www-form-urlencoded"
  },
  body: "slot=" + encodeURIComponent(slot)
})

.then(res => res.json())
.then(data => {
    alert("Slot Exited Successfully")
    location.reload()
})

}

</script>

</head>

<body>

<h1>Welcome {{email}}</h1>

<h2>Enter Parking Details</h2>

<input type="text" id="username" placeholder="Enter Your Name"><br>
<input type="text" id="phone" placeholder="Enter Phone Number"><br>
<input type="text" id="carname" placeholder="Enter Car Name"><br>
<input type="text" id="carnumber" placeholder="Enter Car Number"><br>
<input type="time" id="time"><br><br>

<!-- ========================= -->
<!-- YOUR BOOKED SLOTS (EXIT) -->
<!-- ========================= -->

<h2>Your Booked Slots</h2>

{% if user_slots and user_slots|length > 0 %}

    {% for s in user_slots %}
        <div class="card">
            <p>Slot: {{ s.slot_name }}</p>
            <p>🚗 {{ s.carname }}</p>

            <button onclick="exitSlot('{{s.slot_name}}')">
                ❌ Exit
            </button>
        </div>
    {% endfor %}

{% else %}
    <p>No active booking</p>
{% endif %}

<!-- ========================= -->
<!-- BOOK NEW SLOT -->
<!-- ========================= -->

<h2>Select Parking Slot</h2>

{% for slot in slots %}

<button 
class="slot {{slot.status}}" 
{% if slot.status == "free" %}
onclick="bookSlot('{{slot.slot_name}}')"
{% else %}
disabled
{% endif %}
>

{{slot.slot_name}}

</button>

{% endfor %}

</body>
</html>
